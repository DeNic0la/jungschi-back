# Test Profile - Disable Dev Services and OIDC for CI/non-Docker environments
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.keycloak.devservices.port=0
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.enabled=false
%test.quarkus.oidc.tenant-enabled=false

# Logging (useful for debugging)
%dev.quarkus.log.category."io.quarkus.oidc".level=DEBUG
%dev.quarkus.log.category."io.quarkus.security".level=DEBUG

quarkus.flyway.locations=classpath:db/migration

%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:https://keycloak.denic0la.ch/realms/jungschi}
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_URL:https://keycloak.denic0la.ch/realms/jungschi}
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:*}

# Dev Services - Auto-start Keycloak in dev mode
%dev.quarkus.keycloak.devservices.enabled=true
%dev.quarkus.keycloak.devservices.realm-path=quarkus-realm.json
%dev.quarkus.keycloak.devservices.port=8180

# Security Settings
quarkus.security.auth.enabled-in-dev-mode=true


# Token Lifespan and Refresh
quarkus.oidc.token.lifespan-grace=10

# JWKS and Certificate Caching (performance optimization)
quarkus.oidc.jwks-cache-time-to-live=10H
quarkus.oidc.jwks-cache-size=10

# Connection Timeout Settings
quarkus.oidc.connection-timeout=10s

# Auth Server Configuration
quarkus.oidc.client-id=backend-service

# Application Type: 'service' = Bearer token only (no browser redirects)
quarkus.oidc.application-type=service

# Token Verification Settings
quarkus.oidc.token.audience=backend-service

# Token verification: verify issuer, audience, signature
quarkus.oidc.token.verify-access-token-with-user-info=false