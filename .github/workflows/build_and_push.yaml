name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      IMAGE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          ./gradlew build \
          -Dquarkus.container-image.build=true \
          -Dquarkus.container-image.tag=${{ env.IMAGE_TAG }}
      - name: Push image to Container Registry
        id: push
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.actor }}/${{ github.repository }}:${{ env.IMAGE_TAG }}
          echo "digest=$(docker images --no-trunc --quiet ${{ env.REGISTRY }}/${{ github.actor }}/${{ github.repository }}:${{ env.IMAGE_TAG }})" >> $GITHUB_OUTPUT
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.actor }}/${{ github.repository }}:${{ env.IMAGE_TAG }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false